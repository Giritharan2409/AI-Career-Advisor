<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Roadmap - AI Career Advisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/exam.css') }}">
    <style>
        .roadmap-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .roadmap-header {
            background: #1a1a2e;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid #00d4ff;
            text-align: center;
        }
        
        .roadmap-header h1 {
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        .domain-title {
            color: #00c6ff;
            text-transform: uppercase;
            font-size: 1.5rem;
            margin: 20px 0;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #00d4ff;
            font-size: 1.2rem;
        }
        
        .roadmap-section {
            background: #2d2d44;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .roadmap-section h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #3d3d54;
        }
        
        .learning-path {
            list-style-type: none;
            counter-reset: step-counter;
        }
        
        .learning-path li {
            margin-bottom: 20px;
            padding-left: 40px;
            position: relative;
            border-left: 2px solid #00d4ff;
            padding-bottom: 20px;
        }
        
        .learning-path li:last-child {
            border-left: none;
        }
        
        .learning-path li:before {
            content: counter(step-counter);
            counter-increment: step-counter;
            position: absolute;
            left: -15px;
            top: 0;
            background: #00d4ff;
            color: #1a1a2e;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .resource-list {
            list-style-type: none;
        }
        
        .resource-item {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .resource-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 10px rgba(0, 212, 255, 0.3);
        }
        
        .resource-title {
            color: #c0c0c0;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .resource-link {
            color: #00d4ff;
            text-decoration: none;
            display: inline-block;
            margin-top: 5px;
        }
        
        .resource-link:hover {
            text-decoration: underline;
        }
        
        .error-message {
            background: #f44336;
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }
        
        .back-btn {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
        }
        
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.5);
            background: linear-gradient(135deg, #00d4ff, #0080ff);
        }
        
        .actions {
            text-align: center;
            margin-top: 30px;
        }
        
        .download-btn {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 212, 255, 0.3);
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 15px;
            text-decoration: none;
        }
        
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.5);
            background: linear-gradient(135deg, #00e6ff, #00aaff);
        }
    </style>
</head>
<body>
    <div class="roadmap-container">
        <div class="roadmap-header">
            <h1>Personalized Learning Roadmap</h1>
            <p id="domain-description">Based on your exam results, here's your customized career path</p>
        </div>
        
        <div id="loading" class="loading" style="display: none;">
            <p>Generating your personalized roadmap...</p>
        </div>
        
        <div id="error" class="error-message" style="display: none;">
            <p id="error-text"></p>
        </div>
        
        <div id="roadmap-content" style="display: none;">
            <h2 class="domain-title" id="domain-title">Data Scientist</h2>
            
            <div class="roadmap-section">
                <h2>Learning Path</h2>
                <ol class="learning-path" id="learning-path">
                    <!-- Learning path steps will be inserted here -->
                </ol>
            </div>
            
            <div class="roadmap-section">
                <h2>Free Certifications</h2>
                <ul class="resource-list" id="certifications">
                    <!-- Certifications will be inserted here -->
                </ul>
            </div>
            
            <div class="roadmap-section">
                <h2>YouTube Tutorials</h2>
                <ul class="resource-list" id="youtube-tutorials">
                    <!-- YouTube tutorials will be inserted here -->
                </ul>
            </div>
            
            <div class="roadmap-section">
                <h2>Recommended Books</h2>
                <ul class="resource-list" id="books">
                    <!-- Books will be inserted here -->
                </ul>
            </div>
            
            <div class="actions">
                <button id="downloadBtn" class="download-btn">📥 Download Roadmap (Excel)</button>
                <a href="/" class="back-btn">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        let currentDomain = '';
        let currentRoadmap = {};
        
        document.addEventListener('DOMContentLoaded', async function() {
            // Get domain from localStorage
            const domain = localStorage.getItem('recommendedDomain');
            
            if (!domain) {
                // If no domain found, redirect to home
                window.location.href = '/';
                return;
            }
            
            currentDomain = domain;
            
            // Display domain title
            const domainNames = {
                'data_analyst': 'Data Analyst',
                'data_scientist': 'Data Scientist',
                'machine_learning': 'Machine Learning Engineer'
            };
            
            document.getElementById('domain-title').textContent = domainNames[domain] || 'Data Scientist';
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            
            try {
                // Generate roadmap using Gemini API
                const response = await fetch('/generate_roadmap', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ domain: domain })
                });
                
                const data = await response.json();
                
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                
                if (data.error) {
                    // Show error
                    document.getElementById('error-text').textContent = data.error;
                    document.getElementById('error').style.display = 'block';
                    return;
                }
                
                // Store roadmap data for download
                currentRoadmap = data.roadmap;
                
                // Display roadmap
                displayRoadmap(data.roadmap);
                
                // Show content
                document.getElementById('roadmap-content').style.display = 'block';
                
                // Add download button event listener
                document.getElementById('downloadBtn').addEventListener('click', downloadRoadmap);
            } catch (error) {
                // Hide loading
                document.getElementById('loading').style.display = 'none';
                
                // Show error
                document.getElementById('error-text').textContent = 'Failed to generate roadmap. Please try again.';
                document.getElementById('error').style.display = 'block';
                console.error('Error:', error);
            }
        });
        
        function displayRoadmap(roadmap) {
            // Display learning path
            const learningPathElement = document.getElementById('learning-path');
            learningPathElement.innerHTML = '';
            
            if (roadmap.learningPath && roadmap.learningPath.length > 0) {
                roadmap.learningPath.forEach(step => {
                    const li = document.createElement('li');
                    li.textContent = step;
                    learningPathElement.appendChild(li);
                });
            }
            
            // Display certifications
            const certificationsElement = document.getElementById('certifications');
            certificationsElement.innerHTML = '';
            
            if (roadmap.certifications && roadmap.certifications.length > 0) {
                roadmap.certifications.forEach(cert => {
                    const li = document.createElement('li');
                    li.className = 'resource-item';
                    
                    const title = document.createElement('div');
                    title.className = 'resource-title';
                    title.textContent = cert.name;
                    
                    const link = document.createElement('a');
                    link.className = 'resource-link';
                    link.href = cert.link;
                    link.target = '_blank';
                    link.textContent = 'View Certificate';
                    
                    li.appendChild(title);
                    li.appendChild(link);
                    certificationsElement.appendChild(li);
                });
            }
            
            // Display YouTube tutorials
            const youtubeElement = document.getElementById('youtube-tutorials');
            youtubeElement.innerHTML = '';
            
            if (roadmap.youtubeTutorials && roadmap.youtubeTutorials.length > 0) {
                roadmap.youtubeTutorials.forEach(tutorial => {
                    const li = document.createElement('li');
                    li.className = 'resource-item';
                    
                    const title = document.createElement('div');
                    title.className = 'resource-title';
                    title.textContent = tutorial.title;
                    
                    const link = document.createElement('a');
                    link.className = 'resource-link';
                    link.href = tutorial.link;
                    link.target = '_blank';
                    link.textContent = 'Watch Tutorial';
                    
                    li.appendChild(title);
                    li.appendChild(link);
                    youtubeElement.appendChild(li);
                });
            }
            
            // Display books
            const booksElement = document.getElementById('books');
            booksElement.innerHTML = '';
            
            if (roadmap.books && roadmap.books.length > 0) {
                roadmap.books.forEach(book => {
                    const li = document.createElement('li');
                    li.className = 'resource-item';
                    
                    const title = document.createElement('div');
                    title.className = 'resource-title';
                    title.textContent = book.title;
                    
                    const link = document.createElement('a');
                    link.className = 'resource-link';
                    link.href = book.link;
                    link.target = '_blank';
                    link.textContent = 'View Book';
                    
                    li.appendChild(title);
                    li.appendChild(link);
                    booksElement.appendChild(li);
                });
            }
        }
        
        async function downloadRoadmap() {
            const downloadBtn = document.getElementById('downloadBtn');
            const originalText = downloadBtn.textContent;
            downloadBtn.textContent = '⏳ Generating Excel...';
            downloadBtn.disabled = true;
            
            try {
                const response = await fetch('/download_roadmap', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        domain: currentDomain,
                        roadmap: currentRoadmap
                    })
                });
                
                if (!response.ok) {
                    throw new Error('Failed to download roadmap');
                }
                
                // Get the blob from response
                const blob = await response.blob();
                
                // Create a temporary URL for the blob
                const url = window.URL.createObjectURL(blob);
                
                // Create a temporary anchor element and click it
                const a = document.createElement('a');
                a.href = url;
                a.download = `roadmap_${currentDomain}.xlsx`;
                document.body.appendChild(a);
                a.click();
                
                // Clean up
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                // Reset button
                downloadBtn.textContent = originalText;
                downloadBtn.disabled = false;
            } catch (error) {
                console.error('Error downloading roadmap:', error);
                alert('Failed to download roadmap. Please try again.');
                downloadBtn.textContent = originalText;
                downloadBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
